name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Generate Keystore
        run: |
          keytool -genkey -v             -keystore tasbih-release.keystore             -alias tasbih-key             -keyalg RSA -keysize 2048 -validity 10000             -storepass 123456 -keypass 123456             -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Pre-download NDK 25b (CRITICAL FIX)
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform
          if [ ! -d "android-ndk-r25b" ]; then
            echo "Downloading NDK 25b..."
            wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            echo "Extracting NDK 25b..."
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
          fi
          echo "NDK contents:"
          ls -la $HOME/.buildozer/android/platform/

      - name: Update buildozer.spec
        run: |
          touch buildozer.spec
          safe_set() {
            key="$1"
            val="$2"
            if grep -q "^${key} =" buildozer.spec 2>/dev/null; then
              sed -i "s|^${key} =.*|${key} = ${val}|" buildozer.spec
            else
              echo "${key} = ${val}" >> buildozer.spec
            fi
          }
          safe_set "android.api" "33"
          safe_set "android.minapi" "21"
          safe_set "android.ndk" "25b"
          safe_set "android.archs" "armeabi-v7a arm64-v8a"
          safe_set "android.accept_sdk_license" "True"
          safe_set "android.signing.keystore" "tasbih-release.keystore"
          safe_set "android.signing.alias" "tasbih-key"
          safe_set "android.signing.storepass" "123456"
          safe_set "android.signing.keypass" "123456"
          echo "=== buildozer.spec ==="
          grep -E "^(android\.|log_level)" buildozer.spec || true

      - name: Build Release APK
        run: |
          docker run --rm             -v "$(pwd):/home/user/hostcwd"             -v "$HOME/.buildozer:/home/user/.buildozer"             ghcr.io/kivy/buildozer:latest             android release

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*-release*.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbih-release.keystore
