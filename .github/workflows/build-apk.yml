name: Build Official Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # تزریق مستقیم و بومی ابزارهای اندروید روی سرور جهت کاهش شانس خطا به صفر
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython==0.29.33" buildozer

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tasbih-releser.keystore

      # پذیرش آهنین تمام لایسنس‌ها مستقیماً روی SDK تزریق شده
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-v8
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build Official Release APK
        run: |
          rm -rf bin/
          # مجبور کردن بیلدوزر به استفاده از اندروید آماده سرور به جای دانلود مجدد
          buildozer android release
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          ANDROID_SDK_PATH: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_PATH: ${{ env.ANDROID_HOME }}/ndk-bundle

      - name: Prepare Final Directory
        run: |
          mkdir -p bin/final
          APK=$(find bin -name "*.apk" | sort -V | tail -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No Release APK found"
            exit 1
          fi
          cp "$APK" bin/final/source-apk.apk

      - name: Sign APK Officially
        if: success()
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -v -p 4 bin/final/source-apk.apk bin/final/aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks tasbih-releser.keystore --ks-key-alias tasbih-key --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEY_PASS" --out bin/final/tasbih-signed.apk bin/final/aligned.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/final/tasbih-signed.apk
