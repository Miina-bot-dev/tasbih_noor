name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 not set"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tasbih-releser.keystore

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK
        run: |
          rm -rf bin/
          export BUILDOZER_WARN_ON_ROOT=0
          export BUILDOZER_ANDROID_KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          export BUILDOZER_ANDROID_KEYALIAS_PASS=${{ secrets.KEY_PASS }}
          yes | buildozer android release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*release*.apk
