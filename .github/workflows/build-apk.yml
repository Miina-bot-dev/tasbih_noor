name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools-version: 33.0.2
          ndk-version: 25.2.9519653

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0.0 buildozer

      - name: Generate Keystore
        run: |
          if [ ! -f tasbihnoor.keystore ]; then
            keytool -genkey -v \
              -keystore tasbihnoor.keystore \
              -alias tasbihnoor \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASS }}" \
              -keypass "${{ secrets.KEY_PASS }}" \
              -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"
          fi

      - name: Clean cache
        run: rm -rf .buildozer bin/

      - name: Build APK
        run: yes | buildozer android release 2>&1 | tee build_log.txt
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          BUILDOZER_ANDROID_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          BUILDOZER_ANDROID_KEYALIAS_PASS: ${{ secrets.KEY_PASS }}

      - name: Patch debuggable flag (fixes "incompatible/unsafe" install error)
        if: success()
        run: |
          set -e
          echo "=== Listing all APK files in bin/ ==="
          find bin -name "*.apk" -exec ls -lh {} \;
          APK=$(find bin -name "*.apk" -not -name "*signed*" | sort -V | tail -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK file found at all in bin/"
            ls -la bin/
            exit 1
          fi
          echo "Source APK: $APK"
          mkdir -p bin/final
          python3 patch_debuggable.py "$APK" bin/final/patched-unsigned.apk

      - name: Sign APK
        if: success()
        run: |
          set -e
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -v -p 4 bin/final/patched-unsigned.apk bin/final/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks tasbihnoor.keystore \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASS }}" \
            --key-pass "pass:${{ secrets.KEY_PASS }}" \
            --ks-key-alias tasbihnoor \
            --out bin/final/tasbihnoor-signed.apk \
            bin/final/aligned.apk
          echo "=== Verifying signature (v1/v2/v3 should be true) ==="
          "$BUILD_TOOLS/apksigner" verify -v --print-certs bin/final/tasbihnoor-signed.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/final/tasbihnoor-signed.apk

      - name: Upload Keystore
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbihnoor.keystore
