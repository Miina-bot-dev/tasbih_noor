name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 25.2.9519653

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython>=3.0.0 buildozer

      - name: Decode Keystore from Secret
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set!"
            echo "Run: base64 -w 0 tasbihnoor.keystore"
            echo "Add output to GitHub Secrets as KEYSTORE_BASE64"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tasbihnoor.keystore
          ls -la tasbihnoor.keystore

      - name: Clean cache
        run: rm -rf .buildozer/bin/ bin/

      - name: Build APK
        run: yes | buildozer android release 2>&1 | tee build_log.txt
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          BUILDOZER_ANDROID_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          BUILDOZER_ANDROID_KEYALIAS_PASS: ${{ secrets.KEY_PASS }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*release*.apk
