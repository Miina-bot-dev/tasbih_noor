name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --user root
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Keystore
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v \
              -keystore release.keystore \
              -alias tasbihnoor \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Tasbih Noor, OU=App, O=Mina, L=Tehran, ST=Tehran, C=IR" \
              -storepass tasbihnoor123 \
              -keypass tasbihnoor123
          fi

      - name: Build Release APK
        run: |
          export BUILDOZER_ANDROID_KEYSTORE_PASS=tasbihnoor123
          export BUILDOZER_ANDROID_KEYALIAS_PASS=tasbihnoor123
          buildozer android release
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
