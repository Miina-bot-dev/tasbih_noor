name: Build Official Signed APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tasbih-releser.keystore

      - name: Relax strict compiler warning for old bundled C sources
        run: |
          echo "CFLAGS=-Wno-error=cast-function-type-strict -Wno-implicit-function-declaration -Wno-int-conversion -Wno-error" >> $GITHUB_ENV
          echo "CXXFLAGS=-Wno-error=cast-function-type-strict -Wno-implicit-function-declaration -Wno-int-conversion -Wno-error" >> $GITHUB_ENV

      - name: Cache Android SDK and Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.android
          key: ${{ runner.os }}-buildozer-v3-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v3-

      - name: Build Official Release APK
        run: |
          rm -rf bin/
          buildozer android release --auto-accept-licenses
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          PYTHONHTTPSVERIFY: 1

      - name: Prepare Final Directory
        run: |
          mkdir -p bin/final
          APK=$(find bin -name "*.apk" | grep -v "final" | sort -V | tail -1)
          cp "$APK" bin/final/source-apk.apk

      - name: Sign APK Officially
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -v -p 4 bin/final/source-apk.apk bin/final/aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks tasbih-releser.keystore --ks-key-alias tasbih-key --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEY_PASS" --out bin/final/tasbih-signed.apk bin/final/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/final/tasbih-signed.apk
