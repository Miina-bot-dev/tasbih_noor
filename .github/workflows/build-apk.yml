name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore tasbih-release.keystore -alias tasbih-key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build Debug APK
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Sign APK with apksigner (v2)
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            bash -c "
              APK=\$(ls /home/user/hostcwd/bin/*.apk | head -1)
              ZIPALIGN=\$(find /home/user/.buildozer -name zipalign -type f | head -1)
              APKSIGNER=\$(find /home/user/.buildozer -name apksigner -type f | head -1)
              \$ZIPALIGN -p 4 \$APK /home/user/hostcwd/bin/aligned.apk
              \$APKSIGNER sign --ks /home/user/hostcwd/tasbih-release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out /home/user/hostcwd/bin/tasbih-signed.apk /home/user/hostcwd/bin/aligned.apk
              rm /home/user/hostcwd/bin/aligned.apk
            "

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/tasbih-signed.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbih-release.keystore
