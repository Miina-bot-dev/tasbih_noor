name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── کش .buildozer_global (SDK, NDK, ANT, platform-tools) ───
      - name: Cache Buildozer Global
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      # ─── کش .buildozer (recipeها، کمپایل‌ها، دانلودها) ───
      - name: Cache Buildozer Local
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-local-

      # ─── Build با Buildozer Action ───
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android release
          buildozer_version: stable
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
          BUILDOZER_WARN_ON_ROOT: 0

      # ─── آپلود خروجی ───
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
