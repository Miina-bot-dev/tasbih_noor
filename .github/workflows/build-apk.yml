name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-venv build-essential git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer and dependencies
        run: |
          pip3 install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Generate Keystore (matching buildozer.spec)
        run: |
          keytool -genkey -v \
            -keystore tasbihnoor.keystore \
            -alias tasbihnoor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "123456" \
            -keypass "123456" \
            -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Fix buildozer.spec completely
        run: |
          sed -i '/^android\.api =/d' buildozer.spec
          sed -i '/^android\.sdk =/d' buildozer.spec
          sed -i '/^android\.build_tools =/d' buildozer.spec
          sed -i '/^android\.ndk =/d' buildozer.spec
          sed -i '/^android\.ndk_api =/d' buildozer.spec
          sed -i '/^android\.signing\./d' buildozer.spec
          sed -i '/^android\.gradle_dependencies =/d' buildozer.spec
          sed -i '/^p4a\.branch =/d' buildozer.spec
          sed -i '/^p4a\.local_recipes =/d' buildozer.spec

          {
            echo ""
            echo "# === Auto-fixed by CI ==="
            echo "android.api = 33"
            echo "android.minapi = 21"
            echo "android.ndk = 25b"
            echo "android.ndk_api = 21"
            echo "android.archs = arm64-v8a, armeabi-v7a"
            echo "android.accept_sdk_license = True"
            echo "android.signing.keystore = tasbihnoor.keystore"
            echo "android.signing.alias = tasbihnoor"
            echo "android.signing.storepass = 123456"
            echo "android.signing.keypass = 123456"
          } >> buildozer.spec

          echo "=== Final buildozer.spec ==="
          cat buildozer.spec

      - name: Build Release APK
        run: |
          yes | buildozer android release 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Show error summary if build failed
        if: always()
        run: |
          if [ ! -f bin/*-release-unsigned.apk ] 2>/dev/null && ! ls bin/*.apk >/dev/null 2>&1; then
            echo "## Build Failed - Last 100 lines of error log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Stop if no APK produced
        run: |
          ls bin/*.apk

      - name: Re-sign APK with apksigner (v1 + v2 + v3 scheme)
        run: |
          set -e
          APK=$(find bin -name "*-release-unsigned.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find bin -name "*-release*.apk" | head -n 1)
          fi
          echo "Source APK: $APK"

          BUILD_TOOLS=$(find "$HOME/.buildozer" -type d -path "*build-tools*" | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          mkdir -p bin/final
          "$ZIPALIGN" -v -p 4 "$APK" bin/final/aligned.apk

          "$APKSIGNER" sign \
            --ks tasbihnoor.keystore \
            --ks-pass "pass:123456" \
            --key-pass "pass:123456" \
            --ks-key-alias tasbihnoor \
            --out bin/final/tasbihnoor-signed.apk \
            bin/final/aligned.apk

          echo "=== Verifying signature (must show v1/v2/v3 = true) ==="
          "$APKSIGNER" verify -v --print-certs bin/final/tasbihnoor-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/final/tasbihnoor-signed.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbihnoor.keystore
