name: Build Official Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tasbih-releser.keystore

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-final-pure-60m
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build Official Release APK
        run: |
          rm -rf bin/
          # اجرای مستقیم با تایید اتوماتیک مجوزهای اندروید
          buildozer android release --auto-accept-licenses
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Prepare Final Directory
        run: |
          mkdir -p bin/final
          APK=$(find bin -name "*.apk" | sort -V | tail -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No Release APK found"
            exit 1
          fi
          cp "$APK" bin/final/source-apk.apk

      - name: Sign APK Officially
        if: success()
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          # ردیابی بومی مسیر ابزارها بر اساس توزیع اصلی سیستم‌عامل سرور
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using build-tools at: $BUILD_TOOLS"
          
          "$BUILD_TOOLS/zipalign" -v -p 4 bin/final/source-apk.apk bin/final/aligned.apk
          
          "$BUILD_TOOLS/apksigner" sign \
            --ks tasbih-releser.keystore \
            --ks-key-alias tasbih-key \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out bin/final/tasbih-signed.apk \
            bin/final/aligned.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/final/tasbih-signed.apk
