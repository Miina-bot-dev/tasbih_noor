name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore tasbih-release.keystore -alias tasbih-key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK with Buildozer
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Sign APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore tasbih-release.keystore -storepass 123456 bin/*.apk tasbih-key

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbih-release.keystore
