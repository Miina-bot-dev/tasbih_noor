name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Keystore
        run: |
          # ایجاد کی‌استور
          keytool -genkey -v -keystore tasbih-release.keystore -alias tasbih-key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"
          # انتقال کی‌استور به پوشه اصلی برای دسترسی Buildozer (در صورت نیاز)
          cp tasbih-release.keystore .

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build Release APK with Buildozer
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            android release

      # --- مرحله حیاتی که اضافه شده است ---
      - name: Sign APK manually
        run: |
          # ۱. پیدا کردن فایل APK (چون نام فایل در bin تغییر می‌کند)
          APK_PATH=$(ls bin/*.apk | head -n 1)
          echo "Signing file: $APK_PATH"
          
          # ۲. امضا کردن با Jarsigner
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore tasbih-release.keystore "$APK_PATH" tasbih-key -storepass 123456 -keypass 123456
          
          # ۳. بهینه‌سازی نهایی (Zipalign) - بسیار مهم برای اندروید
          # اگر zipalign در مسیر نیست، باید از ابزارهای اندروید استفاده شود، 
          # اما معمولاً در محیط‌های CI نسخه ساده jarsigner کافی است.
          # برای اطمینان، ما از همان فایل امضا شده استفاده می‌کنیم.
      # ---------------------------------------

      - name: Check output files
        run: ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbih-release.keystore
