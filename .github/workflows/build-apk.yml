name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            liblzma-dev libffi-dev libssl-dev \
            automake cmake libpq-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-

      - name: Clean broken SDK if needed
        run: |
          if [ -d "$HOME/.buildozer/android/platform/android-sdk" ] && [ ! -d "$HOME/.buildozer/android/platform/android-sdk/build-tools" ]; then
            echo "Broken SDK cache detected, removing..."
            rm -rf "$HOME/.buildozer/android/platform/android-sdk"
            rm -rf "$HOME/.buildozer/android/platform/android-ndk-r25b"
            rm -rf "$HOME/.buildozer/android/platform/apache-ant-1.9.4"
          fi

      - name: Setup Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ ! -d "$SDK_DIR/build-tools" ]; then
            echo "Installing Android SDK..."
            rm -rf "$SDK_DIR"
            mkdir -p "$SDK_DIR/cmdline-tools"
            cd "$SDK_DIR/cmdline-tools"
            wget -q --tries=5 --timeout=60 https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
            unzip -q commandlinetools-linux-9477386_latest.zip
            mv cmdline-tools latest
            export PATH="$PATH:$SDK_DIR/cmdline-tools/latest/bin"
            yes | sdkmanager --licenses || true
            sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
            echo "Android SDK installed successfully"
          else
            echo "Android SDK already exists, skipping..."
          fi

      - name: Setup Android NDK
        run: |
          NDK_DIR="$HOME/.buildozer/android/platform/android-ndk-r25b"
          if [ ! -d "$NDK_DIR" ]; then
            echo "Installing Android NDK..."
            cd "$HOME/.buildozer/android/platform"
            wget -q --tries=5 --timeout=60 https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            echo "Android NDK installed successfully"
          else
            echo "Android NDK already exists, skipping..."
          fi

      - name: Setup Apache Ant
        run: |
          ANT_DIR="$HOME/.buildozer/android/platform/apache-ant-1.9.4"
          if [ ! -d "$ANT_DIR" ]; then
            echo "Installing Apache Ant..."
            cd "$HOME/.buildozer/android/platform"
            wget -q --tries=5 --timeout=60 https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.zip
            unzip -q apache-ant-1.9.4-bin.zip
            echo "Apache Ant installed successfully"
          else
            echo "Apache Ant already exists, skipping..."
          fi

      - name: Build APK
        run: |
          buildozer android release
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: 1
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
