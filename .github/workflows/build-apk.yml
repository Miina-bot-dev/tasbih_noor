jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Persian Font
        run: |
          wget -q https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf -O Vazirmatn-Regular.ttf
          ls -la Vazirmatn-Regular.ttf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev libreadline-dev \
            liblzma-dev libjpeg-dev libpng-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Clean everything
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf bin
          rm -rf ~/.gradle
          buildozer android distclean 2>/dev/null || true

      - name: Build APK
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
          GRADLE_HOME: ""
          JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk
