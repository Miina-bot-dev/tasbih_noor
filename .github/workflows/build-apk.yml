name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore tasbih-release.keystore -alias tasbih-key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build Debug APK
        run: |
          docker run --rm \
            -v "$(pwd):/home/user/hostcwd" \
            -v "$HOME/.buildozer:/home/user/.buildozer" \
            ghcr.io/kivy/buildozer:latest \
            android debug

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: sdkmanager "build-tools;33.0.0"

      - name: Sign APK
        run: |
          ls -la bin/
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name zipalign -type f | head -1)
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name apksigner -type f | head -1)
          echo "Found: $ZIPALIGN"
          echo "Found: $APKSIGNER"
          $ZIPALIGN -p 4 bin/*.apk aligned.apk
          $APKSIGNER sign --ks tasbih-release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out tasbih-signed.apk aligned.apk
          ls -la tasbih-signed.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: tasbih-signed.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbih-release.keystore
