name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tasbih-releser.keystore
          ls -la tasbih-releser.keystore

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Pre-download freetype (bypass 502 error)
        run: |
          mkdir -p .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          cd .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype

          if [ -f "freetype-2.14.1.tar.gz" ]; then
            echo "freetype already cached"
            exit 0
          fi

          for url in \
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" \
            "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz"; do
            echo "Trying: $url"
            if curl -L --fail --retry 3 --retry-delay 5 -o freetype-2.14.1.tar.gz "$url"; then
              if gzip -t freetype-2.14.1.tar.gz 2>/dev/null; then
                echo "SUCCESS from $url"
                exit 0
              fi
            fi
            rm -f freetype-2.14.1.tar.gz
          done

          echo "WARNING: Could not pre-download freetype. Build will try itself."

      - name: Build APK
        run: |
          rm -rf bin/
          # تغییر وضعیت بیلد به دباگ جهت تولید ساختار باینری امن و عدم دستکاری مخرب کدها
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Prepare Final Directory
        run: |
          mkdir -p bin/final
          # پیدا کردن فایل APK تولید شده توسط بیلدوزر
          APK=$(find bin -name "*.apk" | sort -V | tail -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "Found APK for signing: $APK"
          cp "$APK" bin/final/source-apk.apk

      - name: Sign APK
        if: success()
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          BUILD_TOOLS=$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"

          # هم‌تراز سازی پکت‌های فایل بدون پچ مخرب مانیفست
          "$BUILD_TOOLS/zipalign" -v -p 4 \
            bin/final/source-apk.apk \
            bin/final/aligned.apk

          # امضای نهایی و رسمی فایل
          "$BUILD_TOOLS/apksigner" sign \
            --ks tasbih-releser.keystore \
            --ks-key-alias tasbih-key \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --key-pass pass:"$KEY_PASS" \
            --out bin/final/tasbih-signed.apk \
            bin/final/aligned.apk

          "$BUILD_TOOLS/apksigner" verify -v --print-certs bin/final/tasbih-signed.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/final/tasbih-signed.apk
