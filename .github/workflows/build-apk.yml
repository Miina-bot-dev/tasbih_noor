name: Build Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev liblzma-dev libffi-dev libssl-dev automake cmake
          pip install --upgrade pip
          pip install buildozer cython
      - run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          rm -rf android-sdk
          wget -q --tries=3 --timeout=60 https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          export PATH="$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$HOME/.buildozer/android/platform/android-sdk/platform-tools"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
      - run: |
          cd ~/.buildozer/android/platform
          rm -rf android-ndk-r25b
          wget -q --tries=3 --timeout=60 https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
      - run: |
          cd ~/.buildozer/android/platform
          rm -rf apache-ant-1.9.4
          wget -q --tries=3 --timeout=60 https://archive.apache.org/dist/ant/binaries/apache-ant-1.9.4-bin.zip
          unzip -q apache-ant-1.9.4-bin.zip
      - run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v \
              -keystore release.keystore \
              -alias tasbihnoor \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Tasbih Noor, OU=App, O=Mina, L=Tehran, ST=Tehran, C=IR" \
              -storepass tasbihnoor123 \
              -keypass tasbihnoor123
          fi
      - run: |
          export PATH="$PATH:$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin:$HOME/.buildozer/android/platform/android-sdk/platform-tools:$HOME/.buildozer/android/platform/apache-ant-1.9.4/bin"
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          buildozer android release
        env:
          BUILDOZER_WARN_ON_ROOT: 0
          BUILDOZER_ANDROID_KEYSTORE_PASS: tasbihnoor123
          BUILDOZER_ANDROID_KEYALIAS_PASS: tasbihnoor123
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: bin/*.apk
