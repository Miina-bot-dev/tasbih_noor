name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore tasbih-release.keystore -alias tasbih-key -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Update buildozer.spec for API 31
        run: |
          set_spec() {
            key=$1
            value=$2
            if grep -q "^$key = " buildozer.spec; then
              sed -i "s|^$key = .*|$key = $value|" buildozer.spec
            else
              echo "$key = $value" >> buildozer.spec
            fi
          }

          # API 31 با NDK r28c سازگاره (API 33 نیست)
          set_spec "android.api" "31"
          set_spec "android.minapi" "21"
          set_spec "android.sdk" "31"
          set_spec "android.ndk" "25b"
          set_spec "android.archs" "armeabi-v7a, arm64-v8a"

          # امضای Release
          set_spec "android.signing.keystore" "tasbih-release.keystore"
          set_spec "android.signing.alias" "tasbih-key"
          set_spec "android.signing.storepass" "123456"
          set_spec "android.signing.keypass" "123456"

          echo "=== buildozer.spec settings ==="
          grep -E "^android\.(api|minapi|sdk|ndk|archs|signing)" buildozer.spec || true

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build Release APK
        run: |
          docker run --rm             -v "$(pwd):/home/user/hostcwd"             -v "$HOME/.buildozer:/home/user/.buildozer"             ghcr.io/kivy/buildozer:latest             android release

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*-release*.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbih-release.keystore
