name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Generate Keystore (matching buildozer.spec)
        run: |
          keytool -genkey -v             -keystore tasbihnoor.keystore             -alias tasbihnoor             -keyalg RSA -keysize 2048 -validity 10000             -storepass 123456 -keypass 123456             -dname "CN=TasbihApp, OU=., O=., L=., ST=., C=IR"

      - name: Fix buildozer.spec completely
        run: |
          # حذف خطوط مشکل‌دار
          sed -i '/^android\.api =/d' buildozer.spec
          sed -i '/^android\.sdk =/d' buildozer.spec
          sed -i '/^android\.ndk =/d' buildozer.spec
          sed -i '/^android\.ndk_api =/d' buildozer.spec
          sed -i '/^android\.signing\./d' buildozer.spec
          sed -i '/^android\.gradle_dependencies =/d' buildozer.spec

          # اضافه کردن مقادیر درست
          echo "" >> buildozer.spec
          echo "# === Auto-fixed by CI ===" >> buildozer.spec
          echo "android.api = 31" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          echo "android.archs = arm64-v8a, armeabi-v7a" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "android.signing.keystore = tasbihnoor.keystore" >> buildozer.spec
          echo "android.signing.alias = tasbihnoor" >> buildozer.spec
          echo "android.signing.storepass = 123456" >> buildozer.spec
          echo "android.signing.keypass = 123456" >> buildozer.spec

          echo "=== Final buildozer.spec ==="
          cat buildozer.spec

      - name: Clean and Build Release APK
        run: |
          rm -rf .buildozer bin/
          docker run --rm             -v "$(pwd):/home/user/hostcwd"             -v "$HOME/.buildozer:/home/user/.buildozer"             ghcr.io/kivy/buildozer:latest             android release

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Signed-APK
          path: bin/*-release*.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Keystore-Backup
          path: tasbihnoor.keystore
