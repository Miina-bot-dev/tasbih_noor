name: Build Debug APK (test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" buildozer

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Pre-download freetype (bypass 502 error)
        run: |
          mkdir -p .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          cd .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype

          if [ -f "freetype-2.14.1.tar.gz" ]; then
            echo "freetype already cached"
            exit 0
          fi

          for url in \
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" \
            "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz"; do
            echo "Trying: $url"
            if curl -L --fail --retry 3 --retry-delay 5 -o freetype-2.14.1.tar.gz "$url"; then
              if gzip -t freetype-2.14.1.tar.gz 2>/dev/null; then
                echo "SUCCESS from $url"
                exit 0
              fi
            fi
            rm -f freetype-2.14.1.tar.gz
          done

          echo "WARNING: Could not pre-download freetype. Build will try itself."

      - name: Build DEBUG APK
        run: |
          rm -rf bin/
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Show built files
        run: find bin -type f

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-Debug-APK
          path: bin/*debug*.apk
