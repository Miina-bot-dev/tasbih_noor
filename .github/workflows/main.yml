name: Build Kivy APK

on:
  push:
    branches:
      - main  # یا هر نام شاخه‌ای که دارید
  workflow_dispatch: # اجازه می‌دهد دستی هم اجرا کنید

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: Build APK with Buildozer
        run: |
          # اضافه کردن دستور برای جلوگیری از توقف در صورت سوالات احتمالی
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app
          # مسیر استاندارد خروجی Buildozer
          path: bin/*.apk

      - name: Log Success
        run: echo "Build completed successfully! Check the Artifacts section."

        uses: actions/upload-artifact@v3
        with:
          name: apk
          path: bin/*.apk
